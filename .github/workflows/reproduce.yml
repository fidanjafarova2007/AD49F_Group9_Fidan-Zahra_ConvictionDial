name: Test and reproduce Milestone 2

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Run offline unit tests
        run: python -m pytest -q
      - name: Download real Yahoo Finance data and run backtest
        run: python -m conviction_dial.cli all
      - name: Upload reproducibility artifact
        uses: actions/upload-artifact@v4
        with:
          name: conviction-dial-milestone2-real-market-data
          path: |
            data/raw/*.csv
            data/processed/*.csv
            data/processed/*.json
            results/*
          if-no-files-found: error
          retention-days: 30
